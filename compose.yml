services:
    node-one:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        env_file: .env.example
        environment:
            KITTYSYNC_APP_DOMAIN: 127.0.0.1
            KITTYSYNC_REDIS_HOST: redis
            KITTYSYNC_DB_HOST: postgres
        ports:
            - 3000:3000
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    node-two:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        env_file: .env.example
        environment:
            KITTYSYNC_APP_DOMAIN: 127.0.1.0
            KITTYSYNC_REDIS_HOST: redis
            KITTYSYNC_DB_HOST: postgres
        ports:
            - 3001:3000
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    postgres:
        image: postgres:14.24
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        volumes:
            - postgres-data:/var/lib/postgresql
        environment:
            POSTGRES_PASSWORD: password
            POSTGRES_USER: kittysync
            POSTGRES_DB: kittysync

    redis:
        image: redis:8.10.3
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

volumes:
    postgres-data:
