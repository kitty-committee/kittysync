services:
    backend-one:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        ports:
            - 5173:5173
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    postgres:
        image: postgres:latest
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        volumes:
            - postgres-data:/var/lib/postgresql
        environment:
            POSTGRES_PASSWORD: password
            POSTGRES_USER: kittysync
            POSTGRES_DB: kittysync

    redis:
        image: redis:latest
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

volumes:
    postgres-data:
