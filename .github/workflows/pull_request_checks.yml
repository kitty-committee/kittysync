name: Pull request checks"

on:
    pull_request:
        types: [opened, synchronize, reopened, edited]
        branches: [main]

jobs:
    checks:
        name: ${{ matrix.script }}
        runs-on: ubuntu-latest
        concurrency:
            group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
            cancel-in-progress: true
        strategy:
            fail-fast: false
            matrix:
                script: [check:lint, check:format, check:type, check:test]

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up pnpm and NodeJS
              uses: pnpm/setup@v3
              with:
                  node-version-file: .nvmrc
                  install: true
                  cache: true

            - name: Install Playwright dependencies
              if: matrix.script == 'check:test'
              run: pnpm frontend playwright install --with-deps

            - name: Run check
              run: pnpm ${{ matrix.script }}
