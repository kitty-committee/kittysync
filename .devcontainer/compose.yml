volumes:
    postgres-data:

services:
    app:
        build: .
        volumes:
            - ../..:/workspaces:cached
        command: sleep infinity # Overrides default command so things don't shut down after the process ends.
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        networks:
            - app-network

    postgres:
        image: postgres:latest
        restart: unless-stopped
        networks:
            - app-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        volumes:
            - postgres-data:/var/lib/postgresql
        environment:
            POSTGRES_PASSWORD: postgres
            POSTGRES_USER: kittysync
            POSTGRES_DB: kittysync

    redis:
        image: redis:latest
        restart: unless-stopped
        networks:
            - app-network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

networks:
    app-network:
        driver: bridge
