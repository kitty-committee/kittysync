name: kittysync-dev
services:
    postgres:
        image: postgres:latest
        restart: unless-stopped
        ports:
            - 5432:5432
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        volumes:
            - postgres-data:/var/lib/postgresql
        environment:
            POSTGRES_PASSWORD: password
            POSTGRES_USER: kittysync
            POSTGRES_DB: kittysync

    redis:
        image: redis:latest
        restart: unless-stopped
        ports:
            - 6379:6379
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

volumes:
    postgres-data:
